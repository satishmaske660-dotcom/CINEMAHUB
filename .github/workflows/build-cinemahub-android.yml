name: Build CinemaHub Android uploader
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-uploader/**"
      - ".github/workflows/build-cinemahub-android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-uploader
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cinemahub-uploader-debug-apk
          path: android-uploader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
